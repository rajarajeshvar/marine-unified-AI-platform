<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hull Crack Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #111113;
            --surface: #1a1a1e;
            --border: #2a2a2e;
            --text: #e4e4e7;
            --text-dim: #8a8a8e;
            --accent: #22c55e;
            --accent-dim: #16a34a;
            --danger: #ef4444;
            --radius: 8px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 0.25rem;
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s;
            background: var(--surface);
        }

        .upload-area:hover,
        .upload-area.drag-over {
            border-color: var(--accent);
        }

        .upload-area p {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .upload-area .browse {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }

        #file-input {
            display: none;
        }

        /* Preview */
        .preview-section {
            margin-top: 1.5rem;
            display: none;
        }

        .preview-section.visible {
            display: block;
        }

        .preview-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .preview-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .preview-box .label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .preview-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .preview-box .empty {
            padding: 3rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Controls */
        .controls {
            margin-top: 1rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dim);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .status-text {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Results */
        .results-section {
            margin-top: 1.5rem;
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        .results-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            min-width: 120px;
        }

        .stat .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .stat .stat-value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.15rem;
        }

        /* Detections table */
        .detections-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .detections-table th {
            text-align: left;
            font-weight: 500;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .detections-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .confidence-bar {
            display: inline-block;
            height: 6px;
            border-radius: 3px;
            background: var(--accent);
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .no-detections {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Error */
        .error-msg {
            background: #1c0f0f;
            border: 1px solid #3b1515;
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .preview-row { grid-template-columns: 1fr; }
            .stats-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hull Crack Detection</h1>
            <p>Upload an underwater hull image to detect structural cracks.</p>
        </header>

        <!-- Upload -->
        <div class="upload-area" id="upload-area">
            <p>Drop an image here or <span class="browse">browse</span></p>
            <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.bmp,.tiff,.webp">
        </div>

        <!-- Error -->
        <div class="error-msg" id="error-msg"></div>

        <!-- Preview -->
        <div class="preview-section" id="preview-section">
            <div class="preview-row">
                <div class="preview-box">
                    <div class="label">Original</div>
                    <img id="original-img" alt="Uploaded image">
                </div>
                <div class="preview-box" id="result-box">
                    <div class="label">Detection Result</div>
                    <div class="empty" id="result-placeholder">Run prediction to see results</div>
                    <img id="result-img" alt="Detection result" style="display: none;">
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="predict-btn" disabled>Predict</button>
                <button class="btn btn-secondary" id="clear-btn">Clear</button>
                <span class="status-text" id="status-text"></span>
            </div>
        </div>

        <!-- Results -->
        <div class="results-section" id="results-section">
            <div class="results-header">Results</div>

            <div class="stats-row" id="stats-row"></div>

            <table class="detections-table" id="detections-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Class</th>
                        <th>Confidence</th>
                        <th>Bounding Box</th>
                    </tr>
                </thead>
                <tbody id="detections-body"></tbody>
            </table>
            <div class="no-detections" id="no-detections" style="display: none;">
                No cracks detected in this image.
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewSection = document.getElementById('preview-section');
        const originalImg = document.getElementById('original-img');
        const resultImg = document.getElementById('result-img');
        const resultPlaceholder = document.getElementById('result-placeholder');
        const predictBtn = document.getElementById('predict-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusText = document.getElementById('status-text');
        const resultsSection = document.getElementById('results-section');
        const statsRow = document.getElementById('stats-row');
        const detectionsBody = document.getElementById('detections-body');
        const noDetections = document.getElementById('no-detections');
        const errorMsg = document.getElementById('error-msg');

        let selectedFile = null;

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handleFile(fileInput.files[0]);
            }
        });

        function handleFile(file) {
            hideError();
            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                originalImg.src = e.target.result;
                previewSection.classList.add('visible');
                predictBtn.disabled = false;

                // Reset result side
                resultImg.style.display = 'none';
                resultPlaceholder.style.display = 'block';
                resultsSection.classList.remove('visible');
                statusText.textContent = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';
            };
            reader.readAsDataURL(file);
        }

        // Predict
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            predictBtn.disabled = true;
            statusText.textContent = 'Running detection...';
            hideError();

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch(API_BASE + '/predict', {
                    method: 'POST',
                    body: formData,
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Prediction failed');
                }

                const data = await res.json();
                showResults(data);
            } catch (err) {
                showError(err.message);
            } finally {
                predictBtn.disabled = false;
            }
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewSection.classList.remove('visible');
            resultsSection.classList.remove('visible');
            hideError();
            statusText.textContent = '';
        });

        function showResults(data) {
            // Annotated image
            if (data.annotated_image_base64) {
                resultImg.src = 'data:image/jpeg;base64,' + data.annotated_image_base64;
                resultImg.style.display = 'block';
                resultPlaceholder.style.display = 'none';
            }

            // Stats
            statsRow.innerHTML = '';
            const stats = [
                { label: 'Detections', value: data.num_detections },
                { label: 'Inference', value: data.inference_time_ms.toFixed(0) + ' ms' },
                { label: 'Model', value: data.model_variant },
                { label: 'Image', value: data.image_size.width + '×' + data.image_size.height },
            ];

            stats.forEach(s => {
                const div = document.createElement('div');
                div.className = 'stat';
                div.innerHTML = '<div class="stat-label">' + s.label + '</div><div class="stat-value">' + s.value + '</div>';
                statsRow.appendChild(div);
            });

            // Detections table
            detectionsBody.innerHTML = '';
            if (data.detections.length === 0) {
                noDetections.style.display = 'block';
                document.getElementById('detections-table').style.display = 'none';
            } else {
                noDetections.style.display = 'none';
                document.getElementById('detections-table').style.display = '';

                data.detections.forEach((det, i) => {
                    const pct = (det.confidence * 100).toFixed(1);
                    const bbox = det.bbox_xyxy.map(v => Math.round(v)).join(', ');
                    const barWidth = Math.max(det.confidence * 60, 4);

                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + (i + 1) + '</td>' +
                        '<td>' + det.class_name + '</td>' +
                        '<td><span class="confidence-bar" style="width:' + barWidth + 'px"></span>' + pct + '%</td>' +
                        '<td>' + bbox + '</td>';
                    detectionsBody.appendChild(tr);
                });
            }

            resultsSection.classList.add('visible');
            statusText.textContent = 'Done — ' + data.num_detections + ' detection(s) in ' + data.inference_time_ms.toFixed(0) + ' ms';
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
        }

        function hideError() {
            errorMsg.classList.remove('visible');
        }
    </script>
</body>
</html>
